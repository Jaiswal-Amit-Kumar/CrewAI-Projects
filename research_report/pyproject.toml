[project]
name = "research_report"
version = "0.1.0"
description = "Research_Report using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "apscheduler>=3.11.2",
    "crewai[tools]==1.9.3",
    "fastapi>=0.128.1",
    "fastapi-sso>=0.20.0",
    "litellm>=1.75.3",
    "python-multipart>=0.0.22",
    "uvicorn>=0.40.0",
]

[project.scripts]
research_report = "research_report.main:run"
run_crew = "research_report.main:run"
train = "research_report.main:train"
replay = "research_report.main:replay"
test = "research_report.main:test"
run_with_trigger = "research_report.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
